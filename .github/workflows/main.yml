name: Build Govt Exam AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q GovtExamAI_Android_v2_FINAL.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/GovtExamAI_Android_v2/android-app
          gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp extracted/GovtExamAI_Android_v2/android-app/app/build/outputs/apk/debug/app-debug.apk GovtExamAI-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GovtExamAI-v2-APK
          path: GovtExamAI-v2.apk
